<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wydarzenia Bawaria 2026 - Grey Liquid Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* Szare, stonowane, animowane tło (Slate/Gray/Zinc) */
            background: linear-gradient(45deg, #0f172a, #1f2937, #111827, #374151);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Szary transparentny Liquid Glass */
        .glass-panel {
            background: rgba(255, 255, 255, 0.04); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #d1d5db; /* Szary tekst */
        }

        .glass-button:hover, .glass-button.active {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.5);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            backdrop-filter: blur(10px);
        }

        .glass-input:focus {
            outline: none;
            border-color: #9ca3af; /* Szara ramka przy focusie */
            background: rgba(0, 0, 0, 0.5);
        }

        .event-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .event-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        #updateToast {
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }
        #updateToast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        
        <header class="glass-panel p-6 flex flex-col md:flex-row justify-between items-center gap-6">
            <h1 class="text-3xl font-extrabold tracking-wider text-white drop-shadow-md flex items-center">
                <span class="w-3 h-3 bg-gray-400 rounded-full mr-3 animate-pulse"></span>
                Bawaria LIVE 2026
            </h1>
            <input type="text" id="searchInput" placeholder="Szukaj (np. Norymberga, drony, gmina)..." 
                   class="glass-input px-6 py-3 rounded-full w-full md:w-1/2 text-sm transition-all">
        </header>

        <section class="glass-panel p-6 space-y-6">
            <div>
                <h3 class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-3 ml-2 drop-shadow-md">Region</h3>
                <div class="flex flex-wrap gap-2" id="regionFilters">
                    <button class="glass-button active px-4 py-2 rounded-full text-sm font-medium" data-region="Wszystkie">Cała Bawaria</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Aichach & Dachau">Aichach & Dachau</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Augsburg">Augsburg</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Monachium">Monachium</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Frankonia (Norymberga)">Frankonia</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Alpy (Allgäu)">Alpy (Allgäu)</button>
                </div>
            </div>
            <div>
                <h3 class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-3 ml-2 drop-shadow-md">Kategoria</h3>
                <div class="flex flex-wrap gap-2" id="categoryFilters">
                    <button class="glass-button active px-4 py-2 rounded-full text-sm font-medium" data-category="Wszystkie">Wszystkie</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Wydarzenia Gminne">Gminne & Jarmarki</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Skoki & Zimowe">Skoki & Zimowe</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Tech & Drony">Tech & E-sport</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Ekstrema">MMA & Motocross</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Pchle Targi">Pchle Targi</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Kulinaria">Kulinaria</button>
                </div>
            </div>
        </section>

        <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="eventsGrid"></main>

    </div>

    <div id="updateToast" class="fixed bottom-6 right-6 glass-panel px-6 py-3 text-sm font-bold text-white z-50 flex items-center">
        <svg class="w-4 h-4 mr-2 animate-spin text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Aktualizacja radaru...
    </div>

    <script>

                image: "https://images.unsplash.com/photo-1599586120429-48281b6f0ece?auto=format&fit=crop&q=80&w=800",

                location: "Hauptmarkt, Nürnberg (Norymberga)",

                description: "Jeden z najstarszych i najbardziej znanych rynków w Bawarii/Frankonii ze słynnymi norymberskimi kiełbaskami.",
                sourceUrl: "https://www.christkindlesmarkt.de/",
                interested: 9500
            },
            {
                title: "75. Vierschanzentournee (Skoki)",
                date: "27 - 29 Grudnia 2026",
                sortDate: "2026-12-27",
                location: "ORLEN Arena, Oberstdorf",
                region: "Alpy (Allgäu)",
                category: "Skoki & Zimowe",
                image: "https://images.unsplash.com/photo-1551524559-8af4e6624178?auto=format&fit=crop&q=80&w=800",
                description: "Otwarcie Turnieju Czterech Skoczni. Potężna impreza sportowa otwierająca najważniejszy narciarski cykl na świecie.",
                sourceUrl: "https://www.orlen-arena.de/",
                interested: 8500
            }
        ];

        let currentRegion = 'Wszystkie';
        let currentCategory = 'Wszystkie';
        let searchQuery = '';

        const grid = document.getElementById('eventsGrid');
        const searchInput = document.getElementById('searchInput');
        const toast = document.getElementById('updateToast');

        function renderEvents() {
            grid.innerHTML = '';
            
            // 1. Filtrowanie
            let filteredEvents = events.filter(event => {
                const matchRegion = currentRegion === 'Wszystkie' || event.region === currentRegion || (currentRegion === 'Cała Bawaria');
                const matchCategory = currentCategory === 'Wszystkie' || event.category === currentCategory;
                const matchSearch = event.title.toLowerCase().includes(searchQuery) || 
                                    event.location.toLowerCase().includes(searchQuery) ||
                                    event.description.toLowerCase().includes(searchQuery);
                return matchRegion && matchCategory && matchSearch;
            });

            // 2. Chronologiczne sortowanie danych (według pola sortDate)
            filteredEvents.sort((a, b) => new Date(a.sortDate) - new Date(b.sortDate));

            if (filteredEvents.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 font-bold tracking-widest uppercase">Brak wydarzeń dla tych kryteriów.</div>`;
                return;
            }

            filteredEvents.forEach(event => {
                const card = document.createElement('article');
                card.className = 'glass-panel event-card flex flex-col relative overflow-hidden group';
                card.setAttribute('onclick', `window.open('${event.sourceUrl}', '_blank')`);
                card.title = "Otwórz oficjalne źródło w nowej karcie";
                
                card.innerHTML = `
                    <div class="relative h-52 overflow-hidden">
                        <img src="${event.image}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy">
                        <div class="absolute inset-0 bg-black/50 group-hover:bg-black/20 transition-colors"></div>
                        
                        <div class="absolute top-3 left-3 bg-gray-800/80 backdrop-blur-md px-3 py-1.5 rounded-sm text-xs font-bold text-gray-200 flex items-center shadow-lg border border-gray-500/30">
                            <svg class="w-3.5 h-3.5 mr-1.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            Sprawdź szczegóły
                        </div>
                    </div>
                    <div class="p-5 flex-1 flex flex-col">
                        <span class="text-xs font-black uppercase text-gray-900 bg-gray-300 inline-block px-2 py-1 rounded-sm mb-3 self-start shadow-sm tracking-wider">${event.category}</span>
                        <h2 class="text-xl font-bold text-white mb-2 leading-tight drop-shadow-md group-hover:text-gray-300 transition-colors">${event.title}</h2>
                        <p class="text-sm text-gray-400 mb-4 line-clamp-3 leading-relaxed">${event.description}</p>
                        
                        <div class="mt-auto space-y-2 pt-4 border-t border-white/10 text-sm font-medium text-gray-300">
                            <div class="flex items-center"><span class="w-4 text-center mr-2">📅</span> ${event.date}</div>
                            <div class="flex items-center"><span class="w-4 text-center mr-2">📍</span> ${event.location}</div>
                            <div class="text-gray-200 font-bold pt-2 flex items-center">
                                <span class="w-2 h-2 bg-gray-400 rounded-full mr-2 animate-pulse"></span>
                                🔥 Hype: <span class="interested-count ml-1 text-white">${event.interested}</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        setInterval(() => {
            events = events.map(e => ({
                ...e,
                interested: Math.max(0, e.interested + Math.floor(Math.random() * 15) - 5)
            }));
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);

            if(document.activeElement !== searchInput) {
                renderEvents();
            }
        }, 15000);

        document.querySelectorAll('#regionFilters button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#regionFilters button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentRegion = e.
