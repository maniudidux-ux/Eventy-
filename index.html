<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokalne Wydarzenia - Gemini Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* Ciemniejsze tło, aby jasnoniebieskie karty lepiej kontrastowały */
            background: linear-gradient(45deg, #0f172a, #1e1b4b, #000000, #172554);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Nowy motyw: Błękitny w 50% transparentny */
        .glass-panel {
            background: rgba(56, 189, 248, 0.5); /* Błękitny, 50% przezroczystości */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-radius: 1.5rem;
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #ffffff;
        }

        .glass-button:hover, .glass-button.active {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            backdrop-filter: blur(10px);
        }

        .glass-input:focus {
            outline: none;
            border-color: #38bdf8;
            background: rgba(0, 0, 0, 0.5);
        }

        .event-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .event-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.7);
        }

        /* Animacja powiadomienia o aktualizacji */
        #updateToast {
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }
        #updateToast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        
        <header class="glass-panel p-6 flex flex-col md:flex-row justify-between items-center gap-6">
            <h1 class="text-3xl font-extrabold tracking-wider text-white drop-shadow-md flex items-center">
                <span class="w-3 h-3 bg-red-500 rounded-full mr-3 animate-pulse"></span>
                Wydarzenia LIVE
            </h1>
            <input type="text" id="searchInput" placeholder="Szukaj wydarzeń..." 
                   class="glass-input px-6 py-3 rounded-full w-full md:w-1/2 text-sm transition-all">
        </header>

        <section class="glass-panel p-6 space-y-6">
            <div>
                <h3 class="text-xs font-bold uppercase tracking-widest text-white mb-3 ml-2 drop-shadow-md">Region</h3>
                <div class="flex flex-wrap gap-2" id="regionFilters">
                    <button class="glass-button active px-4 py-2 rounded-full text-sm font-medium" data-region="Wszystkie">Wszystkie</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Aichach">Aichach</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Dachau">Dachau</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Augsburg">Augsburg</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Neuburg-Schrobenhausen">Neuburg-Schrobenhausen</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Fürstenfeldbruck">Fürstenfeldbruck</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Monachium">Monachium</button>
                </div>
            </div>
            <div>
                <h3 class="text-xs font-bold uppercase tracking-widest text-white mb-3 ml-2 drop-shadow-md">Kategoria</h3>
                <div class="flex flex-wrap gap-2" id="categoryFilters">
                    <button class="glass-button active px-4 py-2 rounded-full text-sm font-medium" data-category="Wszystkie">Wszystkie</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Pchle Targi & Giełdy">Pchle Targi</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Sporty Ekstremalne">Sporty Ekstremalne</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Sport & Rekreacja">Sport</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Kulinaria">Kulinaria</button>
                </div>
            </div>
        </section>

        <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="eventsGrid"></main>

    </div>

    <!-- Toast powiadomienie o aktualizacji -->
    <div id="updateToast" class="fixed bottom-6 right-6 glass-panel px-6 py-3 text-sm font-bold text-white z-50 flex items-center">
        <svg class="w-4 h-4 mr-2 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Synchronizacja danych...
    </div>

    <script>
        let events = [
            {
                title: "Wielki Pchli Targ (Flohmarkt)",
                date: "Sobota, 14 Listopada",
                location: "Volksfestplatz, Aichach",
                region: "Aichach",
                category: "Pchle Targi & Giełdy",
                image: "https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&q=80&w=800",
                description: "Zabytki, antyki i setki stanowisk na świeżym powietrzu.",
                interested: Math.floor(Math.random() * 500) + 50
            },
            {
                title: "Red Bull Munich Supercross",
                date: "Piątek, 20 Listopada",
                location: "Olympiahalle, Monachium",
                region: "Monachium",
                category: "Sporty Ekstremalne",
                image: "https://images.unsplash.com/photo-1549466336-d762f0267277?auto=format&fit=crop&q=80&w=800",
                description: "Najlepsi zawodnicy FMX, Monster Energy i ogromne hopy na największej arenie.",
                interested: Math.floor(Math.random() * 500) + 50
            },
            {
                title: "Ski-Markt (Giełda Narciarska)",
                date: "Niedziela, 22 Listopada",
                location: "Hala Sportowa, Dachau",
                region: "Dachau",
                category: "Pchle Targi & Giełdy",
                image: "https://images.unsplash.com/photo-1551524559-8af4e6624178?auto=format&fit=crop&q=80&w=800",
                description: "Kup i sprzedaj używany sprzęt przed sezonem. Narty alpejskie, buty i kaski.",
                interested: Math.floor(Math.random() * 500) + 50
            },
            {
                title: "Kinderflohmarkt",
                date: "Sobota, 28 Listopada",
                location: "Stadthalle, Augsburg",
                region: "Augsburg",
                category: "Pchle Targi & Giełdy",
                image: "https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?auto=format&fit=crop&q=80&w=800",
                description: "Wielka wyprzedaż ubranek dziecięcych, wózków i zabawek z drugiej ręki.",
                interested: Math.floor(Math.random() * 500) + 50
            },
            {
                title: "Otwarte Zawody Inline Skating",
                date: "Niedziela, 29 Listopada",
                location: "Lokalne ścieżki, Fürstenfeldbruck",
                region: "Fürstenfeldbruck",
                category: "Sport & Rekreacja",
                image: "https://images.unsplash.com/photo-1518118014377-ce6a147e4eb1?auto=format&fit=crop&q=80&w=800",
                description: "Długodystansowe zawody rolkarskie na szybkim asfalcie (koła 84-90mm).",
                interested: Math.floor(Math.random() * 500) + 50
            },
            {
                title: "X-Games Skate & BMX",
                date: "Sobota, 5 Grudnia",
                location: "Olympiapark, Monachium",
                region: "Monachium",
                category: "Sporty Ekstremalne",
                image: "https://images.unsplash.com/photo-1520045892732-304bc3ac5d8e?auto=format&fit=crop&q=80&w=800",
                description: "Zawody w skateparku, muzyka na żywo, BMX i strefa food trucków.",
                interested: Math.floor(Math.random() * 500) + 50
            },
            {
                title: "Festiwal Kociołków i BBQ",
                date: "Niedziela, 6 Grudnia",
                location: "Rynek, Neuburg-Schrobenhausen",
                region: "Neuburg-Schrobenhausen",
                category: "Kulinaria",
                image: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&q=80&w=800",
                description: "Konkurs na najlepszy kociołek nad ogniskiem oraz strefa wędzonych mięs BBQ.",
                interested: Math.floor(Math.random() * 500) + 50
            }
        ];

        let currentRegion = 'Wszystkie';
        let currentCategory = 'Wszystkie';
        let searchQuery = '';

        const grid = document.getElementById('eventsGrid');
        const searchInput = document.getElementById('searchInput');
        const toast = document.getElementById('updateToast');

        // Funkcja ładująca wydarzenie w Google Gemini
        window.openInGemini = function(title, location, date, category) {
            const prompt = `Jako asystent AI przygotuj mi rozbudowany opis lokalnego wydarzenia. Tytuł: "${title}". Wydarzenie odbędzie się ${date} w lokalizacji: ${location}. Kategoria: ${category}. Podaj mi ciekawostki na temat tego typu imprez, na co warto zwrócić uwagę, co ze sobą zabrać i jak najlepiej się przygotować.`;
            const geminiUrl = `https://gemini.google.com/app?q=${encodeURIComponent(prompt)}`;
            window.open(geminiUrl, '_blank');
        };

        function renderEvents() {
            grid.innerHTML = '';
            
            const filteredEvents = events.filter(event => {
                const matchRegion = currentRegion === 'Wszystkie' || event.region === currentRegion;
                const matchCategory = currentCategory === 'Wszystkie' || event.category === currentCategory;
                const matchSearch = event.title.toLowerCase().includes(searchQuery) || event.location.toLowerCase().includes(searchQuery);
                return matchRegion && matchCategory && matchSearch;
            });

            if (filteredEvents.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-white font-bold">Brak wyników.</div>`;
                return;
            }

            filteredEvents.forEach(event => {
                const card = document.createElement('article');
                // Podpinamy funkcję Gemini do kliknięcia całej karty
                card.className = 'glass-panel event-card flex flex-col relative overflow-hidden group';
                card.setAttribute('onclick', `openInGemini('${event.title}', '${event.location}', '${event.date}', '${event.category}')`);
                card.title = "Kliknij, aby wygenerować opis w Gemini";
                
                card.innerHTML = `
                    <div class="relative h-48 overflow-hidden">
                        <img src="${event.image}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div class="absolute inset-0 bg-black/30 group-hover:bg-black/10 transition-colors"></div>
                        <div class="absolute top-2 left-2 bg-blue-600/80 backdrop-blur-md px-2 py-1 rounded text-xs font-bold text-white flex items-center shadow-lg">
                            <span class="w-2 h-2 bg-green-400 rounded-full mr-2 animate-pulse"></span>
                            Otwórz w Gemini
                        </div>
                    </div>
                    <div class="p-5 flex-1 flex flex-col">
                        <span class="text-xs font-black uppercase text-blue-900 bg-white/70 inline-block px-2 py-1 rounded-sm mb-3 self-start shadow-sm">${event.region}</span>
                        <h2 class="text-lg font-bold text-white mb-2 leading-tight drop-shadow-md">${event.title}</h2>
                        <p class="text-sm text-white/90 mb-4 line-clamp-2">${event.description}</p>
                        
                        <div class="mt-auto space-y-2 pt-3 border-t border-white/30 text-sm font-medium text-white/90">
                            <div>📅 ${event.date}</div>
                            <div>📍 ${event.location}</div>
                            <div class="text-green-300 font-bold pt-1">🔥 Zainteresowanych: ${event.interested} osób</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Auto-aktualizacja danych co 15 sekund
        setInterval(() => {
            // Symulacja pobierania nowych danych (np. zmiana liczby zainteresowanych)
            events = events.map(e => ({
                ...e,
                interested: e.interested + Math.floor(Math.random() * 5) - 1 // +/- wahania
            }));
            
            // Wyświetl toast
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);

            // Przerenderuj widok, jeśli użytkownik akurat nie wpisuje w pole wyszukiwania
            if(document.activeElement !== searchInput) {
                renderEvents();
            }
        }, 15000);

        // Nasłuchiwanie filtrów
        document.querySelectorAll('#regionFilters button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#regionFilters button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentRegion = e.target.dataset.region;
                renderEvents();
            });
        });

        document.querySelectorAll('#categoryFilters button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#categoryFilters button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                renderEvents();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderEvents();
        });

        renderEvents();
    </script>
</body>
</html>
