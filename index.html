<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wydarzenia Bawaria 2026 - Grey Liquid Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(45deg, #0f172a, #1f2937, #111827, #374151);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.04); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            color: #d1d5db;
        }

        .glass-button:hover, .glass-button.active {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.5);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            backdrop-filter: blur(10px);
        }

        .glass-input:focus {
            outline: none;
            border-color: #9ca3af;
            background: rgba(0, 0, 0, 0.5);
        }

        .event-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .event-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        #updateToast {
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }
        #updateToast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="p-4 md:p-8">

                Bawaria LIVE 2026

            <input type="text" id="searchInput" placeholder="Szukaj (np. Norymberga, drony, gmina)..."

        </header>

        <section class="glass-panel p-6 space-y-6">
            <div>
                <h3 class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-3 ml-2 drop-shadow-md">Wybierz Region</h3>
                <div class="flex flex-wrap gap-2" id="regionFilters">
                    <button class="glass-button active px-4 py-2 rounded-full text-sm font-medium" data-region="Wszystkie">Cała Bawaria</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Aichach & Dachau">Aichach & Dachau</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Augsburg">Augsburg</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Monachium">Monachium</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Norymberga">Norymberga</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Alpy">Alpy (Skoki)</button>
                </div>
            </div>
            
            <div>
                <h3 class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-3 ml-2 drop-shadow-md">Wybierz Kategorię</h3>
                <div class="flex flex-wrap gap-2" id="categoryFilters">
                    <button class="glass-button active px-4 py-2 rounded-full text-sm font-medium" data-category="Wszystkie">Wszystkie</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Jarmarki & Gminne">Gminne & Jarmarki</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Sport & Skoki">Sport & Skoki</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Tech & E-sport">Tech & E-sport</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Motoryzacja & MMA">Motoryzacja & MMA</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Pchle Targi">Pchle Targi</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Kulinaria">Kulinaria</button>
                </div>
            </div>
        </section>

        <!-- Sekcja wyników -->
        <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="eventsGrid"></main>

    </div>

    <!-- Pływające powiadomienie -->
    <div id="updateToast" class="fixed bottom-6 right-6 glass-panel px-6 py-3 text-sm font-bold text-white z-50 flex items-center">
        <svg class="w-4 h-4 mr-2 animate-spin text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Aktualizacja statystyk...
    </div>

            },
            {

                date: "Niedziela, 27 Grudnia 2026",

                location: "ORLEN Arena, Oberstdorf",
                region: "Alpy",
                category: "Sport & Skoki",
                image: "https://images.unsplash.com/photo-1520119859551-78df31cbacdf?auto=format&fit=crop&q=80&w=800",
                description: "Wielkie sportowe otwarcie 75. Turnieju Czterech Skoczni. Oficjalne treningi i kwalifikacje gigantów światowego narciarstwa.",

                interested: 8500

            {

                description: "Legendarny, noworoczny konkurs skoków narciarskich (Vierschanzentournee) rozgrywany u stóp pasma górskiego Wetterstein.",

        var currentRegion = 'Wszystkie';
        var currentCategory = 'Wszystkie';
        var searchQuery = '';

        function renderEvents() {
            try {
                var grid = document.getElementById('eventsGrid');
                var searchInputObj = document.getElementById('searchInput');
                
                if (!grid) return;

                // Bezpieczne filtrowanie danych
                var filteredEvents = events.filter(function(item) {
                    var matchRegion = (currentRegion === 'Wszystkie') || (item.region === currentRegion) || (currentRegion === 'Cała Bawaria');
                    var matchCategory = (currentCategory === 'Wszystkie') || (item.category === currentCategory);
                    var matchSearch = item.title.toLowerCase().includes(searchQuery) || 
                                      item.location.toLowerCase().includes(searchQuery) ||
                                      item.description.toLowerCase().includes(searchQuery);
                    return matchRegion && matchCategory && matchSearch;
                });

                // Bezpieczne sortowanie (standardowe)
                filteredEvents.sort(function(a, b) {
                    if (a.sortDate > b.sortDate) return 1;
                    if (a.sortDate < b.sortDate) return -1;
                    return 0;
                });

                // Brak wyników
                if (filteredEvents.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400 font-bold tracking-widest uppercase">Brak wydarzeń dla tych kryteriów.</div>';
                    return;
                }

                // Generowanie HTML jako tekst (najbardziej wydajne i bezbłędne dla przeglądarek mobilnych)
                var htmlContent = '';
                
                filteredEvents.forEach(function(item) {
                    htmlContent += '<article class="glass-panel event-card flex flex-col relative overflow-hidden group" onclick="window.open(\'' + item.sourceUrl + '\', \'_blank\')" title="Otwórz stronę">';
                    htmlContent += '  <div class="relative h-52 overflow-hidden">';
                    htmlContent += '      <img src="' + item.image + '" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy">';
                    htmlContent += '      <div class="absolute inset-0 bg-black/50 group-hover:bg-black/20 transition-colors"></div>';
                    htmlContent += '      <div class="absolute top-3 left-3 bg-gray-800/80 backdrop-blur-md px-3 py-1.5 rounded-sm text-xs font-bold text-gray-200 flex items-center shadow-lg border border-gray-500/30">';
                    htmlContent += '          Sprawdź szczegóły';
                    htmlContent += '      </div>';
                    htmlContent += '  </div>';
                    htmlContent += '  <div class="p-5 flex-1 flex flex-col">';
                    htmlContent += '      <span class="text-xs font-black uppercase text-gray-900 bg-gray-300 inline-block px-2 py-1 rounded-sm mb-3 self-start shadow-sm tracking-wider">' + item.category + '</span>';
                    htmlContent += '      <h2 class="text-xl font-bold text-white mb-2 leading-tight drop-shadow-md group-hover:text-gray-300 transition-colors">' + item.title + '</h2>';
                    htmlContent += '      <p class="text-sm text-gray-400 mb-4 line-clamp-3 leading-relaxed">' + item.description + '</p>';
                    htmlContent += '      <div class="mt-auto space-y-2 pt-4 border-t border-white/10 text-sm font-medium text-gray-300">';
                    htmlContent += '          <div class="flex items-center"><span class="w-4 text-center mr-2">📅</span> ' + item.date + '</div>';
                    htmlContent += '          <div class="flex items-center"><span class="w-4 text-center mr-2">📍</span> ' + item.location + '</div>';
                    htmlContent += '          <div class="text-gray-200 font-bold pt-2 flex items-center">';
                    htmlContent += '              <span class="w-2 h-2 bg-gray-400 rounded-full mr-2 animate-pulse"></span>🔥 Hype: <span class="ml-1 text-white">' + item.interested + '</span>';
                    htmlContent += '          </div>';
                    htmlContent += '      </div>';
                    htmlContent += '  </div>';
                    htmlContent += '</article>';
                });

                grid.innerHTML = htmlContent;

            } catch (err) {
                var errorGrid = document.getElementById('eventsGrid');
                if(errorGrid) {
                    errorGrid.innerHTML = '<div class="col-span-full bg-red-900/80 p-6 rounded-xl border border-red-500 text-white font-bold text-center">Błąd renderowania: ' + err.message + '</div>';
                }
            }
        }

        // Animacja powiadomienia i przeliczanie danych pozbawiona błędogennych nowinek
        setInterval(function() {
            events.forEach(function(item) {
                item.interested = Math.max(0, item.interested + Math.floor(Math.random() * 15) - 5);
            });
            
            var toastObj = document.getElementById('updateToast');
            if(toastObj) {
                toastObj.classList.add('show');
                setTimeout(function() { toastObj.classList.remove('show'); }, 2500);
            }

            if(document.activeElement !== document.getElementById('searchInput')) {
                renderEvents();
            }
        }, 15000);

        // Obsługa interfejsu (Filtry & Wyszukiwarka) podłączona dopiero, gdy struktura istnieje
        document.addEventListener("DOMContentLoaded", function() {
            
            document.querySelectorAll('#regionFilters button').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    document.querySelectorAll('#regionFilters button').forEach(function(b) { b.classList.remove('active'); });
                    e.target.classList.add('active');
                    currentRegion = e.target.getAttribute('data-region');
                    renderEvents();
                });
            });

            document.querySelectorAll('#categoryFilters button').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    document.querySelectorAll('#categoryFilters button').forEach(function(b) { b.classList.remove('active'); });
                    e.target.classList.add('active');
                    currentCategory = e.target.getAttribute('data-category');
                    renderEvents();
                });
            });

            document.getElementById('searchInput').addEventListener('input', function(e) {
                searchQuery = e.target.value.toLowerCase();
                renderEvents();
            });

            // Start aplikacji
            renderEvents();
        });
    </script>
</body>
</html>
