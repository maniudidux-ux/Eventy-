<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wydarzenia Bawaria 2026 - Grey Liquid Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* Szare, stonowane tło w stylu Slate/Zinc */
            background: linear-gradient(45deg, #0f172a, #1f2937, #111827, #374151);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.04); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #d1d5db;
        }

        .glass-button:hover, .glass-button.active {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.5);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            backdrop-filter: blur(10px);
        }

        .glass-input:focus {
            outline: none;
            border-color: #9ca3af;
            background: rgba(0, 0, 0, 0.5);
        }

        .event-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .event-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        #updateToast {
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }
        #updateToast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="p-4 md:p-8">

        </header>

        <section class="glass-panel p-6 space-y-6">

            <div>

                    <button class="glass-button active px-4 py-2 rounded-full text-sm font-medium" data-region="Wszystkie">Cała Bawaria</button>

                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Monachium">Monachium</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Norymberga">Norymberga</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-region="Alpy">Alpy (Skoki)</button>
                </div>
            </div>
            
            <!-- Kategorie -->
            <div>

                    <button class="glass-button active px-4 py-2 rounded-full text-sm font-medium" data-category="Wszystkie">Wszystkie</button>

                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Tech & E-sport">Tech & E-sport</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Motoryzacja & MMA">Motoryzacja & MMA</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Pchle Targi">Pchle Targi</button>
                    <button class="glass-button px-4 py-2 rounded-full text-sm font-medium" data-category="Kulinaria">Kulinaria</button>
                </div>
            </div>
        </section>

        <!-- Pusta siatka do wygenerowania kart -->
        <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="eventsGrid"></main>

    </div>

    <!-- Dyskretne powiadomienie o "żywych" aktualizacjach -->
